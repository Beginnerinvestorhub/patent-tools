#
# Offline checks for every push and pull request to main. No secrets are
# used: the live USPTO smoke test (connector/test/smoke.mjs) needs an API key
# and runs only on a developer's computer, for example
#   cd connector && node --env-file=../.env test/smoke.mjs
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  connector:
    name: Patent Connector (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: connector/package-lock.json

      - name: Install exact dependencies (test client only; the server has none)
        run: npm ci

      - name: Syntax check sources
        run: |
          for f in index.js lib/*.js scripts/*.mjs test/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Offline tests against index.js (security, retry, features)
        run: npm run test:offline

      - name: Server has no dependencies
        run: test "$(node -p "Object.keys(require('./package.json').dependencies || {}).length")" = "0"

      - name: Server starts without node_modules and lists all tools
        run: |
          mkdir -p "$RUNNER_TEMP/bare"
          cp -r index.js lib package.json "$RUNNER_TEMP/bare/"
          node scripts/check-bundle.mjs "$RUNNER_TEMP/bare/index.js"

      - name: Desktop extension (.mcpb) validates, packs and starts
        # Packs index.js and lib/ as Claude Desktop installs them, then
        # starts the unpacked index.js and lists the tools.
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "$RUNNER_TEMP/patent-connector.mcpb"
          mkdir -p "$RUNNER_TEMP/mcpb"
          unzip -q "$RUNNER_TEMP/patent-connector.mcpb" -d "$RUNNER_TEMP/mcpb"
          for f in test dist docs scripts node_modules .env; do
            if [ -e "$RUNNER_TEMP/mcpb/$f" ]; then echo "$f must not be packed"; exit 1; fi
          done
          node scripts/check-bundle.mjs "$RUNNER_TEMP/mcpb/index.js"

  skill:
    name: Patent Drawing skill (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: skills/patent-drawing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/patent-drawing/scripts/requirements.txt

      - name: Install script requirements
        run: pip install -r scripts/requirements.txt

      - name: Script tests
        run: python tests/run_script_tests.py
