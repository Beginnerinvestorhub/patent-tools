#
# Builds the `release` branch that the Claude Code marketplace installs
# from (.claude-plugin/marketplace.json points there). It is main without
# the paths in .github/release_exclude.txt: no tests, binary fixtures,
# build scripts, project site or manifests for other hosts. Runs after CI
# passes on main, or by hand from the Actions tab.
#
# It also builds the `directory` branch, the edition submitted to the
# Claude plugin directory: the drawing skill alone, as Markdown and images
# (.github/scripts/build_directory.sh).
name: Release branch

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push the release branch
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Build the release tree
        run: .github/scripts/build_release.sh "$RUNNER_TEMP/release"

      - name: Server in the release tree starts and lists all tools
        run: node connector/scripts/check-bundle.mjs "$RUNNER_TEMP/release/connector/index.js"

      - name: Commit and push the release branch
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: .github/scripts/push_branch.sh "$RUNNER_TEMP/release" release "$SOURCE_SHA"

  directory:
    # The edition submitted to the Claude plugin directory: the drawing
    # skill as Markdown and images only (see build_directory.sh).
    name: Build and push the directory branch
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Build and check the directory tree
        run: .github/scripts/build_directory.sh "$RUNNER_TEMP/directory"

      - name: Commit and push the directory branch
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: .github/scripts/push_branch.sh "$RUNNER_TEMP/directory" directory "$SOURCE_SHA"
