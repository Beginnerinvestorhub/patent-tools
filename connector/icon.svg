<?xml version="1.0" encoding="UTF-8"?>
<!-- Patent Connector icon: line drawing of a US outlet plate with a plug
     inserted and cord running down; the plate's screw head is replaced by
     the figure label "FIG. 1". -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Plate -->
  <rect x="128" y="56" width="256" height="368" rx="28"
        fill="#ffffff" stroke="#111111" stroke-width="22"/>

  <!-- "FIG. 1" where the plate screw would be -->
  <text x="256" y="118" font-family="Arial, Helvetica, sans-serif"
        font-size="46" font-weight="bold" text-anchor="middle"
        fill="#111111">FIG. 1</text>

  <!-- Receptacle face -->
  <rect x="186" y="132" width="140" height="224" rx="14"
        fill="#ffffff" stroke="#111111" stroke-width="11"/>
  <!-- two slots -->
  <rect x="222" y="152" width="18" height="44" rx="6" fill="#111111"/>
  <rect x="272" y="152" width="18" height="44" rx="6" fill="#111111"/>
  <!-- ground hole -->
  <path d="M 240,216 h 32 a 16,16 0 0 1 -32,0 z" fill="#111111"/>

  <!-- Plug inserted in the lower receptacle -->
  <rect x="220" y="248" width="72" height="22" rx="9"
        fill="#ffffff" stroke="#111111" stroke-width="9"/>
  <rect x="206" y="262" width="100" height="94" rx="16"
        fill="#ffffff" stroke="#111111" stroke-width="11"/>
  <rect x="220" y="278" width="72" height="60" rx="8"
        fill="#ffffff" stroke="#111111" stroke-width="8"/>

  <!-- Cord: opaque strip behind the two edge lines so nothing shows
       through between them -->
  <rect x="234" y="356" width="44" height="142" fill="#ffffff"/>
  <line x1="242" y1="356" x2="242" y2="498" stroke="#111111" stroke-width="11"/>
  <line x1="270" y1="356" x2="270" y2="498" stroke="#111111" stroke-width="11"/>
</svg>
